[package]
name = "dantalian"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "rustls"] }
axum = { version = "0", features = ["multipart"] }
axum-extra = { version = "0", features = ["multipart"] }
base64 = { version = "0", features = ["std"] }
chrono = { version = "0", features = ["serde"] }
chrono-tz = "0"
dirs = "6"
dotenvy = "0"
lofty = "0"
ogg = "0"
quick-xml = { version = "0", features = ["serialize"] }
reqwest = { version = "0", features = ["charset", "cookies", "default-tls", "hickory-dns", "http2", "json", "native-tls"], default-features = false }
rusqlite = { version = "0", features = ["backup", "bundled"] }
scraper = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0"
shiguredo_opus = { git = "https://github.com/shiguredo/opus-rs", version = "2026.1.0", features = ["source-build"] }
symphonia = { version = "0", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0", features = ["fs"] }
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
ua_generator = { git = "https://github.com/spider-rs/ua_generator.git", version = "0" }
urlencoding = "2"

[features]
fdk-aac = ["dep:shiguredo_fdk_aac"]

[target.'cfg(target_os = "linux")'.dependencies]
shiguredo_fdk_aac = { git = "https://github.com/shiguredo/fdk-aac-rs", version = "2026.1.0-canary.1", optional = true }
