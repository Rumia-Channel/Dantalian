[package]
name = "tsukuyomi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["multipart"] }
base64 = { version = "0.22.1", features = ["std"] }
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
quick-xml = { version = "0.39.2", features = ["serialize"] }
reqwest = { version = "0.13.2", features = ["cookies", "json"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
scraper = "0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sha3 = "0.10.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ua_generator = { git = "https://github.com/spider-rs/ua_generator.git", version = "0.5.54" }
urlencoding = "2.1.3"
