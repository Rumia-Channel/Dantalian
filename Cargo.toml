[package]
name = "dantalian"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dantalian"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "rustls"], optional = true }
axum = { version = "0", features = ["multipart"], optional = true }
axum-extra = { version = "0", features = ["multipart"], optional = true }
base64 = { version = "0", features = ["std"], optional = true }
chrono = { version = "0", features = ["serde"] }
chrono-tz = "0"
dirs = { version = "6", optional = true }
dotenvy = { version = "0", optional = true }
lofty = { version = "0", optional = true }
ogg = { version = "0", optional = true }
quick-xml = { version = "0", features = ["serialize"], optional = true }
reqwest = { version = "0", features = ["charset", "cookies", "default-tls", "hickory-dns", "http2", "json", "native-tls"], default-features = false, optional = true }
rusqlite = { version = "0", features = ["backup", "bundled"], optional = true }
scraper = { version = "0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = { version = "0", optional = true }
shiguredo_opus = { git = "https://github.com/shiguredo/opus-rs", version = "2026.1.0", features = ["source-build"], optional = true }
symphonia = { version = "0", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0", features = ["fs"], optional = true }
tracing = { version = "0", optional = true }
tracing-subscriber = { version = "0", features = ["env-filter"], optional = true }
ua_generator = { git = "https://github.com/spider-rs/ua_generator.git", version = "0", optional = true }
urlencoding = { version = "2", optional = true }

[features]
default = ["native"]
native = [
    "dep:aws-sdk-s3",
    "dep:axum",
    "dep:axum-extra",
    "dep:base64",
    "dep:dirs",
    "dep:dotenvy",
    "dep:lofty",
    "dep:ogg",
    "dep:quick-xml",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:scraper",
    "dep:sha3",
    "dep:shiguredo_opus",
    "dep:symphonia",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:ua_generator",
    "dep:urlencoding",
]
fdk-aac = ["native", "dep:shiguredo_fdk_aac"]

[target.'cfg(target_os = "linux")'.dependencies]
shiguredo_fdk_aac = { git = "https://github.com/shiguredo/fdk-aac-rs", version = "2026.1.0-canary.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
