[package]
name = "dantalian-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = false
codegen-units = 1

[dependencies]
dantalian = { version = "0.1.0", path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
worker = { version = "=0.8.4", features = ["d1"] }
