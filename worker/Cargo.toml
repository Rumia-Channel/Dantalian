[package]
name = "dantalian-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = false
codegen-units = 1

[dependencies]
dantalian = { version = "0.1.0", path = "..", default-features = false }
futures-util = { version = "0.3.34", features = ["std"] }
hmac = "0.13.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "js"] }
worker = { version = "=0.8.4", features = ["d1"] }
