name = "dantalian-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-11"
workers_dev = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/audio/*", "/images/*", "/epubs/*"]

[build]
command = "node build_assets.mjs && worker-build --release"

[vars]
DANTALIAN_AUTH_REQUIRED = "false"

[[d1_databases]]
binding = "DB"
database_name = "dantalian-local"
database_id = "local-dantalian"
migrations_dir = "migrations"

[[queues.producers]]
queue = "dantalian-audio-jobs"
binding = "AUDIO_JOB_QUEUE"


[[durable_objects.bindings]]
name = "NDL_COORDINATOR"
class_name = "NdlCoordinator"

[[migrations]]
tag = "ndl-coordinator-v1"
new_sqlite_classes = ["NdlCoordinator"]

[triggers]
crons = ["0 * * * *"]