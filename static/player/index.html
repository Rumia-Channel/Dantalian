<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dantalian - プレイヤー</title>
    <link rel="stylesheet" href="/css/base.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/player.css?v=ASSET_VERSION">
</head>
<body class="player-body">
    <div class="player-ambient" aria-hidden="true">
        <div class="player-ambient-img" id="ambient-a"></div>
        <div class="player-ambient-img" id="ambient-b"></div>
        <div class="player-ambient-shade"></div>
    </div>

    <div class="player-shell">
        <header class="player-topbar">
            <span class="player-eyebrow">
                <span class="player-eyebrow-dot" id="status-dot"></span>
                <span id="status-label">NOW PLAYING</span>
            </span>
            <button class="player-iconbtn player-close" id="btn-close" aria-label="閉じる" title="閉じる">
                <span class="material-icons">close</span>
            </button>
        </header>

        <main class="player-main">
            <section class="player-coverwrap">
                <div class="player-cover" id="cover">
                    <img id="cover-img" src="" alt="" draggable="false">
                    <div class="player-cover-fallback" id="cover-fallback">
                        <span class="material-icons">album</span>
                    </div>
                </div>
            </section>

            <section class="player-info">
                <div class="player-titles">
                    <h2 class="player-track-title" id="track-title">—</h2>
                    <div class="player-album" id="album-title">—</div>
                    <div class="player-artist" id="artist-name">—</div>
                </div>

                <div class="player-progress">
                    <div class="player-progress-bar" id="progress-bar" role="slider" aria-label="再生位置" tabindex="0">
                        <div class="player-progress-fill" id="progress-fill"></div>
                        <div class="player-progress-thumb" id="progress-thumb"></div>
                    </div>
                    <div class="player-times">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="player-iconbtn player-albumnav" id="btn-prev-album" aria-label="前のアルバム" title="前のアルバム">
                        <span class="material-icons">album</span>
                        <span class="player-albumnav-chevron material-icons">chevron_left</span>
                    </button>
                    <button class="player-iconbtn player-ctrl" id="btn-prev" aria-label="前の曲" title="前の曲">
                        <span class="material-icons">skip_previous</span>
                    </button>
                    <button class="player-playbtn" id="btn-play" aria-label="再生/一時停止" title="再生/一時停止">
                        <span class="material-icons" id="play-icon">play_arrow</span>
                    </button>
                    <button class="player-iconbtn player-ctrl" id="btn-next" aria-label="次の曲" title="次の曲">
                        <span class="material-icons">skip_next</span>
                    </button>
                    <button class="player-iconbtn player-albumnav" id="btn-next-album" aria-label="次のアルバム" title="次のアルバム">
                        <span class="material-icons">album</span>
                        <span class="player-albumnav-chevron material-icons">chevron_right</span>
                    </button>
                </div>

                <div class="player-volume">
                    <button class="player-iconbtn player-volbtn" id="btn-mute" aria-label="ミュート" title="ミュート">
                        <span class="material-icons" id="vol-icon">volume_up</span>
                    </button>
                    <input type="range" id="volume" class="player-volslider" min="0" max="100" value="100" aria-label="音量">
                </div>

                <div class="player-tracklist-wrap">
                    <button class="player-tracklist-toggle" id="tracklist-toggle" aria-expanded="true">
                        <span class="player-tracklist-toggle-label">トラックリスト</span>
                        <span class="player-tracklist-count" id="tracklist-count"></span>
                        <span class="material-icons player-tracklist-caret">expand_more</span>
                    </button>
                    <ol class="player-tracklist" id="tracklist"></ol>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/utils.js?v=ASSET_VERSION"></script>
    <script src="/js/player/engine.js?v=ASSET_VERSION"></script>
    <script src="/js/player/main.js?v=ASSET_VERSION"></script>
</body>
</html>
