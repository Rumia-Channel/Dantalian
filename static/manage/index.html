<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dantalian - 管理</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=ASSET_VERSION">
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <meta name="theme-color" content="#08090f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dantalian">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/base.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/auth.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/series.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/settings.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/responsive.css?v=ASSET_VERSION">
</head>
<body data-active-nav="manage">
    <div id="app">

        <section class="series-manage">
            <div class="series-tabs" role="tablist" aria-label="管理項目">
                <button class="series-tab active" role="tab" aria-selected="true" aria-controls="panel-series" onclick="switchSeriesTab('series')" id="tab-series"><span class="material-icons" aria-hidden="true">collections_bookmark</span>シリーズ</button>
                <button class="series-tab" role="tab" aria-selected="false" aria-controls="panel-grand-series" onclick="switchSeriesTab('grand-series')" id="tab-grand-series"><span class="material-icons" aria-hidden="true">account_tree</span>大シリーズ</button>
                <button class="series-tab" role="tab" aria-selected="false" aria-controls="panel-storage-locations" onclick="switchSeriesTab('storage-locations')" id="tab-storage-locations"><span class="material-icons" aria-hidden="true">inventory_2</span>保管場所</button>
                <button class="series-tab" role="tab" aria-selected="false" aria-controls="panel-labels" onclick="switchSeriesTab('labels')" id="tab-labels"><span class="material-icons" aria-hidden="true">label</span>レーベル</button>
                <button class="series-tab" role="tab" aria-selected="false" aria-controls="panel-borrowers" onclick="switchSeriesTab('borrowers')" id="tab-borrowers"><span class="material-icons" aria-hidden="true">person</span>借り手</button>
                <button class="series-tab" role="tab" aria-selected="false" aria-controls="panel-settings" onclick="switchSeriesTab('settings')" id="tab-settings"><span class="material-icons" aria-hidden="true">settings</span>設定</button>
            </div>
            <div id="panel-series" class="series-tab-panel" role="tabpanel" aria-labelledby="tab-series" aria-hidden="false">
                <h3 class="manage-panel-title">シリーズ</h3>
                <div class="series-create">
                    <input type="text" id="new-series-name" placeholder="新しいシリーズ名">
                    <button onclick="createSeries()" class="btn btn-primary">作成</button>
                </div>
                <div id="series-list"></div>
            </div>
            <div id="panel-grand-series" class="series-tab-panel hidden" role="tabpanel" aria-labelledby="tab-grand-series" aria-hidden="true">
                <h3 class="manage-panel-title">大シリーズ</h3>
                <div class="series-create">
                    <input type="text" id="new-grand-series-name" placeholder="新しい大シリーズ名">
                    <button onclick="createGrandSeries()" class="btn btn-primary">作成</button>
                </div>
                <div id="grand-series-list"></div>
            </div>
            <div id="panel-storage-locations" class="series-tab-panel hidden" role="tabpanel" aria-labelledby="tab-storage-locations" aria-hidden="true">
                <h3 class="manage-panel-title">保管場所</h3>
                <div class="series-create">
                    <input type="text" id="new-location-name" placeholder="新しい保管場所名">
                    <select id="new-location-parent" class="form-input">
                        <option value="">親なし (トップレベル)</option>
                    </select>
                    <button onclick="createStorageLocation()" class="btn btn-primary">作成</button>
                </div>
                <div id="storage-location-list"></div>
            </div>
            <div id="panel-labels" class="series-tab-panel hidden" role="tabpanel" aria-labelledby="tab-labels" aria-hidden="true">
                <h3 class="manage-panel-title">レーベル</h3>
                <div class="series-create">
                    <input type="text" id="new-label-name" placeholder="新しいレーベル名">
                    <button onclick="createLabel()" class="btn btn-primary">作成</button>
                </div>
                <div id="label-list"></div>
            </div>
            <div id="panel-borrowers" class="series-tab-panel hidden" role="tabpanel" aria-labelledby="tab-borrowers" aria-hidden="true">
                <h3 class="manage-panel-title">借り手</h3>
                <div class="series-create">
                    <input type="text" id="new-borrower-name" placeholder="新しい借り手の名前">
                    <button onclick="createBorrower()" class="btn btn-primary">作成</button>
                </div>
                <div id="borrower-list"></div>
            </div>
            <div id="panel-settings" class="series-tab-panel hidden" role="tabpanel" aria-labelledby="tab-settings" aria-hidden="true">
                <h3 class="manage-panel-title">設定</h3>
                <div id="settings-form"></div>
            </div>
        </section>
    </div>
    <script src="/js/header.js?v=ASSET_VERSION"></script>
    <script src="/js/pwa.js?v=ASSET_VERSION"></script>
    <script src="/js/utils.js?v=ASSET_VERSION"></script>
    <script src="/js/searchable-select.js?v=ASSET_VERSION"></script>
    <script src="/js/settings.js?v=ASSET_VERSION"></script>
    <script src="/js/series.js?v=ASSET_VERSION"></script>
    <script src="/js/storage-locations.js?v=ASSET_VERSION"></script>
    <script src="/js/labels.js?v=ASSET_VERSION"></script>
    <script src="/js/borrowers.js?v=ASSET_VERSION"></script>
    <script src="/js/settings-manage.js?v=ASSET_VERSION"></script>
    <script>
        (async () => {
            await loadSeries();
            await loadGrandSeries();
            await loadStorageLocations();
            await loadLabels();
            await loadBooks();
            await loadCds();
            await loadBorrowers();
            renderSeriesManager();
            renderStorageLocations();
            renderLabels();
        })();
    </script>
</body>
</html>
