<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsukuyomi - シリーズ管理</title>
    <link rel="stylesheet" href="/css/base.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/series.css?v=ASSET_VERSION">
</head>
<body>
    <div id="app">
        <h1>Tsukuyomi</h1>
        <nav>
            <a href="/">書籍一覧</a>
            <a href="/register/">登録</a>
            <a href="/manage/" class="active">管理</a>
        </nav>

        <section class="series-manage">
            <h2>シリーズ管理</h2>
            <div class="series-tabs">
                <button class="series-tab active" onclick="switchSeriesTab('series')" id="tab-series">シリーズ</button>
                <button class="series-tab" onclick="switchSeriesTab('grand-series')" id="tab-grand-series">大シリーズ</button>
            </div>
            <div id="panel-series" class="series-tab-panel">
                <div class="series-create">
                    <input type="text" id="new-series-name" placeholder="新しいシリーズ名">
                    <button onclick="createSeries()">作成</button>
                </div>
                <div id="series-list"></div>
            </div>
            <div id="panel-grand-series" class="series-tab-panel hidden">
                <div class="series-create">
                    <input type="text" id="new-grand-series-name" placeholder="新しい大シリーズ名">
                    <button onclick="createGrandSeries()">作成</button>
                </div>
                <div id="grand-series-list"></div>
            </div>
        </section>
    </div>
    <script src="/js/utils.js?v=ASSET_VERSION"></script>
    <script src="/js/series.js?v=ASSET_VERSION"></script>
    <script>
        (async () => {
            await loadSeries();
            await loadGrandSeries();
            await loadBooks();
            renderSeriesManager();
        })();
    </script>
</body>
</html>
