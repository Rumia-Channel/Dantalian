<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dantalian - 読書</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/base.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/auth.css?v=ASSET_VERSION">
    <link rel="stylesheet" href="/css/reader.css?v=ASSET_VERSION">
</head>
<body class="reader-launcher">
    <main id="reader-status" role="status" aria-live="polite">
        <h1 id="reader-title">読書リーダー</h1>
        <p id="reader-status-message">Bibi の専用読書画面を開いています…</p>
        <div class="reader-actions">
            <a id="reader-back" class="btn btn-sm btn-ghost" href="/books/">本一覧に戻る</a>
            <a id="reader-edit" class="btn btn-sm btn-ghost hidden">書籍情報</a>
            <a id="reader-download" class="btn btn-sm btn-outline-accent hidden">ファイルをダウンロード</a>
        </div>
    </main>
    <script src="/js/auth.js?v=ASSET_VERSION"></script>
    <script src="/js/reader.js?v=ASSET_VERSION"></script>
</body>
</html>
