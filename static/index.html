<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsukuyomi - 書籍管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Tsukuyomi</h1>

        <section class="register">
            <h2>ISBNで書籍登録</h2>
            <form id="register-form">
                <input type="text" id="isbn-input" placeholder="ISBN (10桁または13桁)" pattern="[0-9\-]+" required>
                <button type="submit" id="register-btn">登録</button>
            </form>
            <p id="register-status"></p>
        </section>

        <section class="booklist">
            <h2>登録済み書籍 <span id="book-count"></span></h2>
            <div id="book-grid"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
