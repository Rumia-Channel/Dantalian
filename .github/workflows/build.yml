name: build

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup component add rustfmt llvm-tools
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Check shared core
        run: cargo check --no-default-features
      - name: Check portable audio codec
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --no-default-features --features audio-codec --target wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test native target
        run: cargo test --features native --no-fail-fast
      - name: Verify native license generation
        env:
          DANTALIAN_GENERATE_LICENSES: "1"
        run: cargo check --features native --locked

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WORKER_API_TOKEN: dantalian-ci-test-token
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup component add rustfmt
          rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.4 --locked
      - name: Build Worker
        run: worker-build --release
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        working-directory: .
        run: npm install --no-audit --no-fund --no-package-lock --no-save wrangler@4.120.1
      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply dantalian-local --local --config wrangler.toml
      - name: Start local Worker
        run: |
          npx wrangler dev --local --port 8793 --config wrangler.toml --var DANTALIAN_AUTH_REQUIRED:true --var DANTALIAN_API_TOKEN:$WORKER_API_TOKEN > worker.log 2>&1 &
          echo $! > worker.pid
      - name: Wait for local Worker
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8793/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat worker.log
          exit 1
      - name: Test Worker audio contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/audio_contract.mjs
      - name: Test Worker audio job contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/audio_jobs_contract.mjs
      - name: Test Worker HTTP contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/series_contract.mjs
      - name: Test Worker UI contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/ui_contract.mjs
      - name: Test Worker books pagination contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/books_pagination_contract.mjs
      - name: Test Worker authentication contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/auth_contract.mjs
      - name: Test missing authentication configuration
        run: |
          trap 'kill "$(cat auth.pid)"' EXIT
          npx wrangler dev --local --port 8794 --config wrangler.toml --var DANTALIAN_AUTH_REQUIRED:true > auth.log 2>&1 &
          echo $! > auth.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8794/api/health; then
              break
            fi
            sleep 2
          done
          WORKER_BASE_URL=http://127.0.0.1:8794 WORKER_EXPECT_UNCONFIGURED=true node --test tests/auth_contract.mjs
      - name: Test Worker scheduled and static assets
        run: |
          test "$(curl --silent --show-error --write-out '%{http_code}' --output /dev/null http://127.0.0.1:8793/)" = 200
          test "$(curl --silent --show-error --write-out '%{http_code}' --output /dev/null http://127.0.0.1:8793/cdn-cgi/local/scheduled)" = 200
      - name: Test Worker helpers
        run: cargo test --lib
