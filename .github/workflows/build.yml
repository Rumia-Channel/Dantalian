name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup component add rustfmt llvm-tools
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Check shared core
        run: cargo check --no-default-features
      - name: Check portable audio codec
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --no-default-features --features audio-codec --target wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test native target
        run: cargo test --features native --no-fail-fast
      - name: Verify native license generation
        env:
          DANTALIAN_GENERATE_LICENSES: "1"
        run: cargo check --features native --locked

      - name: Build audio processor release binary
        run: cargo build --release --bin audio_processor --features native,audio-codec --locked

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WORKER_API_TOKEN: dantalian-ci-test-token
      WORKER_PROCESSOR_TOKEN: dantalian-ci-processor-token
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup component add rustfmt
          rustup target add wasm32-unknown-unknown
      - name: Fetch locked Worker dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.4 --locked
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Build Worker assets
        run: node build_assets.mjs
      - name: Build Worker
        run: worker-build --release
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Node and Wrangler dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Check Container Controller
        working-directory: .
        run: npm run typecheck:container
      - name: Check Container Worker configuration
        working-directory: .
        run: npx wrangler deploy --dry-run --containers-rollout=none --config wrangler.audio.toml
      - name: Build audio processor container image
        working-directory: .
        run: docker build --file container/Dockerfile --tag dantalian-audio-processor:ci .
      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply dantalian-local --local --config wrangler.toml
      - name: Start local Worker
        run: |
          npx wrangler dev --local --port 8793 --config wrangler.toml --var DANTALIAN_AUTH_REQUIRED:true --var DANTALIAN_API_TOKEN:$WORKER_API_TOKEN --var DANTALIAN_PROCESSOR_TOKEN:$WORKER_PROCESSOR_TOKEN > worker.log 2>&1 &
          echo $! > worker.pid
      - name: Wait for local Worker
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8793/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat worker.log
          exit 1
      - name: Test Worker audio contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/audio_contract.mjs
      - name: Test Worker audio job contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
          WORKER_PROCESSOR_TOKEN: dantalian-ci-processor-token
        run: node --test tests/audio_jobs_contract.mjs
      - name: Test Worker HTTP contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/series_contract.mjs
      - name: Test Worker UI contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/ui_contract.mjs
      - name: Test Worker books pagination contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/books_pagination_contract.mjs
      - name: Test Worker licenses contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
        run: node --test tests/licenses_contract.mjs
      - name: Test Worker authentication contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
          WORKER_EXPECT_AUTH_REQUIRED: "true"
        run: node --test tests/auth_contract.mjs
      - name: Test Worker settings runtime contract
        env:
          WORKER_BASE_URL: http://127.0.0.1:8793
          WORKER_API_TOKEN: dantalian-ci-test-token
        run: node --test tests/settings_contract.mjs
      - name: Test missing authentication configuration
        run: |
          trap 'kill "$(cat auth.pid)"' EXIT
          npx wrangler dev --local --port 8794 --config wrangler.toml --var DANTALIAN_AUTH_REQUIRED:true > auth.log 2>&1 &
          echo $! > auth.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8794/api/health; then
              break
            fi
            sleep 2
          done
          WORKER_BASE_URL=http://127.0.0.1:8794 WORKER_EXPECT_UNCONFIGURED=true node --test tests/auth_contract.mjs
      - name: Test Worker scheduled and static assets
        run: |
          test "$(curl --silent --show-error --write-out '%{http_code}' --output /dev/null http://127.0.0.1:8793/)" = 200
          test "$(curl --silent --show-error --write-out '%{http_code}' --output /dev/null http://127.0.0.1:8793/cdn-cgi/local/scheduled)" = 200
      - name: Test Worker helpers
        run: cargo test --lib

  staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [native, worker]
    runs-on: ubuntu-latest
    concurrency:
      group: dantalian-staging-deploy
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DANTALIAN_DEPLOY_TARGET: staging
      DANTALIAN_D1_DATABASE_NAME: ${{ secrets.DANTALIAN_D1_DATABASE_NAME }}
      DANTALIAN_AUDIO_JOB_QUEUE: ${{ secrets.DANTALIAN_AUDIO_JOB_QUEUE }}
      WASABI_ACCESS_KEY_ID_SECRET_NAME: ${{ secrets.WASABI_ACCESS_KEY_ID_SECRET_NAME }}
      WASABI_SECRET_ACCESS_KEY_SECRET_NAME: ${{ secrets.WASABI_SECRET_ACCESS_KEY_SECRET_NAME }}
      WASABI_ENDPOINT_SECRET_NAME: ${{ secrets.WASABI_ENDPOINT_SECRET_NAME }}
      WASABI_REGION_SECRET_NAME: ${{ secrets.WASABI_REGION_SECRET_NAME }}
      WASABI_BUCKET_SECRET_NAME: ${{ secrets.WASABI_BUCKET_SECRET_NAME }}
      DANTALIAN_STAGING_API_TOKEN: ${{ secrets.DANTALIAN_STAGING_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
      - name: Fetch locked Worker dependencies
        working-directory: worker
        run: cargo fetch --locked
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install deployment dependencies
        run: npm ci --ignore-scripts
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.4 --locked
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Provision staging resources
        id: resources
        working-directory: worker
        run: python ci/provision_resources.py
      - name: Render staging Wrangler config
        working-directory: worker
        env:
          DANTALIAN_D1_DATABASE_NAME: ${{ steps.resources.outputs.database_name }}
          DANTALIAN_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          DANTALIAN_AUDIO_JOB_QUEUE: ${{ steps.resources.outputs.queue_name }}
        run: python ci/render_config.py
      - name: Apply staging D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply "${{ steps.resources.outputs.database_name }}" --remote --config wrangler.ci.toml
      - name: Prepare staging authentication secret
        working-directory: worker
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("DANTALIAN_STAGING_API_TOKEN", "").strip()
          if not token:
              raise SystemExit("DANTALIAN_STAGING_API_TOKEN is required")
          Path("staging-secrets.json").write_text(
              json.dumps({"DANTALIAN_API_TOKEN": token}),
              encoding="utf-8",
          )
          PY
      - name: Deploy staging Worker
        id: deploy
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.ci.toml --secrets-file staging-secrets.json 2>&1 | tee deploy.log
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          urls = re.findall(r"https://[A-Za-z0-9.-]+\.workers\.dev", Path("deploy.log").read_text(encoding="utf-8"))
          if not urls:
              raise SystemExit("staging Worker URL was not reported by Wrangler")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"base_url={urls[-1]}\n")
          PY
      - name: Test staging health and assets
        env:
          WORKER_BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          test "$(curl --silent --show-error --write-out '%{http_code}' --output /dev/null "$WORKER_BASE_URL/")" = 200
          for attempt in {1..30}; do
            if curl --silent --show-error "$WORKER_BASE_URL/api/health" | python -c 'import json, sys; body = json.load(sys.stdin); raise SystemExit(0 if body.get("authentication_required") is True else 1)'; then
              exit 0
            fi
            sleep 2
          done
          echo "staging Worker did not report authentication mode"
          curl --silent --show-error "$WORKER_BASE_URL/api/health"
          exit 1
      - name: Test staging authentication
        working-directory: worker
        env:
          WORKER_BASE_URL: ${{ steps.deploy.outputs.base_url }}
          WORKER_API_TOKEN: ${{ secrets.DANTALIAN_STAGING_API_TOKEN }}
          WORKER_EXPECT_AUTH_REQUIRED: "true"
        run: node --test tests/auth_contract.mjs
      - name: Test staging Wasabi basic and multipart lifecycle
        working-directory: worker
        env:
          WORKER_BASE_URL: ${{ steps.deploy.outputs.base_url }}
          WORKER_API_TOKEN: ${{ secrets.DANTALIAN_STAGING_API_TOKEN }}
          WASABI_E2E: "1"
        run: node --test tests/wasabi_e2e.mjs tests/wasabi_multipart_e2e.mjs
      - name: Clean staging deployment files
        if: always()
        working-directory: worker
        run: rm -f wrangler.ci.toml staging-secrets.json deploy.log

  production:
    name: Deploy production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native, worker]
    runs-on: ubuntu-latest
    concurrency:
      group: dantalian-production-deploy
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SERVICE_DOMAIN: ${{ secrets.SERVICE_DOMAIN }}
      DANTALIAN_DEPLOY_TARGET: production
      DANTALIAN_D1_DATABASE_NAME: ${{ secrets.DANTALIAN_D1_DATABASE_NAME }}
      DANTALIAN_AUDIO_JOB_QUEUE: ${{ secrets.DANTALIAN_AUDIO_JOB_QUEUE }}
      WASABI_ACCESS_KEY_ID_SECRET_NAME: ${{ secrets.WASABI_ACCESS_KEY_ID_SECRET_NAME }}
      WASABI_SECRET_ACCESS_KEY_SECRET_NAME: ${{ secrets.WASABI_SECRET_ACCESS_KEY_SECRET_NAME }}
      WASABI_ENDPOINT_SECRET_NAME: ${{ secrets.WASABI_ENDPOINT_SECRET_NAME }}
      WASABI_REGION_SECRET_NAME: ${{ secrets.WASABI_REGION_SECRET_NAME }}
      WASABI_BUCKET_SECRET_NAME: ${{ secrets.WASABI_BUCKET_SECRET_NAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release tag is based on master
        run: |
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
      - name: Fetch locked Worker dependencies
        working-directory: worker
        run: cargo fetch --locked
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install deployment dependencies
        run: npm ci --ignore-scripts
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.4 --locked
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Provision production resources
        id: resources
        working-directory: worker
        run: python ci/provision_resources.py
      - name: Render production Wrangler config
        working-directory: worker
        env:
          DANTALIAN_D1_DATABASE_NAME: ${{ steps.resources.outputs.database_name }}
          DANTALIAN_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          DANTALIAN_AUDIO_JOB_QUEUE: ${{ steps.resources.outputs.queue_name }}
        run: python ci/render_config.py
      - name: Apply production D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply "${{ steps.resources.outputs.database_name }}" --remote --config wrangler.ci.toml
      - name: Deploy production Worker
        working-directory: worker
        run: |
          trap 'rm -f wrangler.ci.toml' EXIT
          npx wrangler deploy --config wrangler.ci.toml
